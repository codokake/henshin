<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SF変身デバイス</title>
<style>
  @font-face { font-family: 'Rajdhani'; src: local('Rajdhani'); }
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    width: 100%; height: 100%;
    background: #020408;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  #app {
    position: relative;
    width: 100%;
    max-width: 390px;
    height: 100%;
    max-height: 844px;
    margin: 0 auto;
    background: #030508;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .hidden { display: none !important; }

  /* ── Scanline texture ── */
  #scanline {
    position: absolute; inset: 0; pointer-events: none; z-index: 50;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,220,255,0.006) 3px, rgba(0,220,255,0.006) 4px);
  }

  /* ── Particle canvas ── */
  #particles { position: absolute; inset: 0; pointer-events: none; z-index: 35; }

  /* ── Flash overlay ── */
  #flash {
    position: absolute; inset: 0; z-index: 45; pointer-events: none;
    background: rgba(0,220,255,0.92);
    opacity: 0;
  }
  #flash.active { animation: screenFlash 0.55s ease-out forwards; }
  @keyframes screenFlash { 0%{opacity:0;} 15%{opacity:1;} 100%{opacity:0;} }

  /* ── Device layers ── */
  #device-area { position: absolute; top: 72px; left: 0; right: 0; height: 560px; }
  .dev-layer {
    position: absolute; inset: 0;
    transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1);
    pointer-events: none;
    opacity: 0;
  }
  .dev-layer svg { display: block; }
  .dev-layer img { width: 100%; height: 100%; object-fit: contain; display:block; }

  #dim-overlay { position: absolute; inset: 0; pointer-events: none; background: rgba(2,4,8,0.72); transition: background 0.5s; z-index: 2; }
  #tap-zone { position: absolute; inset: 0; z-index: 3; touch-action: none; }
  #tap-zone.clickable { cursor: pointer; }
  #hud-overlay { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  #hud-overlay svg { position: absolute; inset: 0; overflow: visible; }

  .device-caption {
    position: absolute; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; pointer-events: none;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Header HUD ── */
  #header-hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: calc(52px + env(safe-area-inset-top,0px)) 24px 14px;
    z-index: 8; pointer-events: none;
  }
  #header-hud span {
    color: #0d2020; font-size: 9px; letter-spacing: 0.3em;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Control area ── */
  #control-area {
    position: absolute; left: 0; right: 0; bottom: 0;
    top: 632px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding-bottom: 44px; z-index: 8;
  }

  /* ── Power button ── */
  .power-wrap { position: relative; width: 104px; height: 104px; }
  .power-ripple {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(0,212,255,0.5);
    animation: powerTap 0.45s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @keyframes powerTap { 0%{transform:scale(1);opacity:.8;} 100%{transform:scale(1.7);opacity:0;} }
  .power-deco-ring {
    position: absolute; inset: -12px; border-radius: 50%;
    border: 1px dashed rgba(0,180,210,0.12);
  }
  #power-btn {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #111c26, #06090f);
    border: 1.5px solid #1c3040;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    overflow: hidden;
  }
  #power-btn img { width: 78%; height: 78%; object-fit: contain; }
  @keyframes powerIdle {
    0%,100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.0), 0 0 12px rgba(0,212,255,0.1); }
    50% { box-shadow: 0 0 0 4px rgba(0,212,255,0.06), 0 0 24px rgba(0,212,255,0.2); }
  }
  #power-btn.power-idle { animation: powerIdle 3s ease-in-out infinite; }

  /* ── Authentication icon (centered on device, AUTH phase) ── */
  .auth-icon-wrap {
    position: absolute; left: 195px; top: 280px; transform: translate(-50%,-50%);
    width: 128px; height: 128px; z-index: 6; pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(0,190,220,0.3));
    transition: filter 0.4s, transform 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  .auth-icon-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .auth-icon-wrap.state-idle { animation: authIconIdle 2.6s ease-in-out infinite; }
  @keyframes authIconIdle {
    0%,100% { filter: drop-shadow(0 0 6px rgba(0,190,220,0.28)); transform: translate(-50%,-50%) scale(1); }
    50% { filter: drop-shadow(0 0 14px rgba(0,190,220,0.5)); transform: translate(-50%,-50%) scale(1.03); }
  }
  .auth-icon-wrap.state-scanning { animation: authIconScan 1.1s ease-in-out infinite; }
  @keyframes authIconScan {
    0%,100% { filter: drop-shadow(0 0 14px rgba(0,212,255,0.6)) drop-shadow(0 0 26px rgba(0,212,255,0.28)); transform: translate(-50%,-50%) scale(1.08); }
    50% { filter: drop-shadow(0 0 22px rgba(0,212,255,0.9)) drop-shadow(0 0 38px rgba(0,212,255,0.4)); transform: translate(-50%,-50%) scale(1.13); }
  }
  .auth-icon-wrap.state-verified {
    filter: drop-shadow(0 0 18px rgba(0,255,136,0.8)) drop-shadow(0 0 30px rgba(0,255,136,0.35));
    transform: translate(-50%,-50%) scale(1.1);
  }

  /* ── Touch (auth) button ── */
  .touch-wrap { position: relative; width: 92px; height: 92px; }
  #touch-btn {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #101c26, #05080e);
    border: 1.5px solid #1c3040;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
  }
  #touch-btn img { width: 84%; height: 84%; object-fit: contain; }
  #touch-btn.touch-idle { animation: powerIdle 2.2s ease-in-out infinite; }

  .caption-text {
    color: rgba(0,200,220,0.22); font-size: 9px; letter-spacing: 0.42em;
    font-family: 'JetBrains Mono', monospace; text-align:center;
  }

  .energy-bar-track {
    width: 180px; height: 3px; background: rgba(0,40,50,0.8);
    border-radius: 2px; overflow: hidden; border: 1px solid rgba(0,80,100,0.5);
  }
  .energy-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg,#00a0c0,#00d4ff);
    border-radius: 2px;
    transition: width 0.09s linear, background 0.3s;
  }
  .energy-bar-fill.ready {
    background: linear-gradient(90deg,#00d4ff,#00ff88);
    animation: chargeReady 0.9s ease-in-out infinite;
  }
  @keyframes chargeReady {
    0%,100% { filter: drop-shadow(0 0 6px rgba(0,255,120,0.3)); }
    50% { filter: drop-shadow(0 0 20px rgba(0,255,120,0.7)); }
  }

  .tx-blink-text {
    font-size: 11px; letter-spacing: 0.55em;
    font-family: 'JetBrains Mono', monospace;
    color: rgba(0,212,255,0.6);
    filter: drop-shadow(0 0 8px #00d4ff);
    animation: txBlink 0.4s ease-in-out infinite;
  }
  .tx-blink-text.tx-done { color: rgba(255,255,255,0.9); filter: drop-shadow(0 0 14px white); }
  @keyframes txBlink { 0%,100%{opacity:1;} 40%{opacity:.15;} }

  .complete-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .complete-sub {
    color: rgba(0,212,255,0.3); font-size: 9px; letter-spacing: 0.32em;
    font-family: 'JetBrains Mono', monospace;
  }
  .complete-stats {
    display:flex; gap:20px; color: rgba(0,212,255,0.18); font-size: 8px;
    letter-spacing: 0.22em; font-family: 'JetBrains Mono', monospace;
  }

  /* ── Home indicator ── */
  #home-indicator {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center; align-items: flex-end;
    height: 34px; padding-bottom: calc(8px + env(safe-area-inset-bottom,0px));
    z-index: 9; pointer-events: none;
  }
  .home-bar { width: 134px; height: 5px; background: #0a1618; border-radius: 3px; }

  /* ── Final input overlay ── */
  #final-input {
    position: absolute; inset: 0; background: #020406;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 25;
    animation: fiEnter 0.4s ease-out forwards;
  }
  @keyframes fiEnter { from{opacity:0;} to{opacity:1;} }
  .fi-label {
    position: absolute; top: calc(88px + env(safe-area-inset-top,0px));
    color: rgba(0,200,220,0.22); font-size: 9px; letter-spacing: 0.45em;
    font-family: 'JetBrains Mono', monospace;
  }
  .fi-line-wrap { position: relative; width: 260px; height: 2px; }
  .fi-line-bg {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,transparent,rgba(0,212,255,0.2) 10%,rgba(0,212,255,0.2) 90%,transparent);
  }
  @keyframes hudLinePulse { 0%,100%{opacity:.3;} 50%{opacity:.7;} }
  .hud-line-pulse { animation: hudLinePulse 1.6s ease-in-out infinite; }
  .fi-progress {
    position: absolute; top:0; left:0; bottom:0; width: 2%;
    background: linear-gradient(90deg,transparent,#00d4ff 40%,#00d4ff);
    box-shadow: 0 0 12px #00d4ff;
    transition: width 0.2s;
  }
  .fi-progress.dragging { transition: none; }
  .line-traveler {
    position: absolute; top:-2px; width:6px; height:6px; border-radius:50%;
    background:#00d4ff; box-shadow: 0 0 10px #00d4ff, 0 0 20px rgba(0,212,255,0.5);
    animation: lineTravel 1.8s ease-in-out infinite;
  }
  @keyframes lineTravel { 0%{left:0%;opacity:0;} 8%{opacity:1;} 92%{opacity:1;} 100%{left:calc(100% - 6px);opacity:0;} }
  .fi-hint {
    position: absolute; bottom: calc(140px + env(safe-area-inset-bottom,0px));
    display: flex; align-items: center; gap: 10px;
    color: rgba(0,200,220,0.42); font-size: 10px;
    letter-spacing: 0.35em; font-family: 'JetBrains Mono', monospace;
  }
  @keyframes arrowSlide { 0%,100%{transform:translateX(0);opacity:.5;} 50%{transform:translateX(8px);opacity:1;} }
  .swipe-arrow { display:inline-block; animation: arrowSlide 1.4s ease-in-out infinite; }

  /* ── Misc animations reused by HUD SVG (applied via class on SVG elements) ── */
  @keyframes authSpin { to { stroke-dashoffset: -502; } }
  .auth-spin { animation: authSpin 1.8s linear infinite; }
  @keyframes authExpand { 0%{r:78px;opacity:0;} 30%{r:108px;opacity:.9;} 100%{r:95px;opacity:.4;} }
  .auth-expand { animation: authExpand 0.55s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes corePulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }
  .core-pulse { animation: corePulse 2.6s ease-in-out infinite; }
  @keyframes txRing {
    0% { transform-origin: 195px 280px; transform: scale(0.35); opacity: 0; }
    55% { opacity: 0.9; transform: scale(1.05); }
    100% { transform: scale(1); opacity: 0.6; }
  }
  .tx-ring { animation: txRing 0.5s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rotateCW { to { transform: rotate(360deg); } }
  @keyframes rotateCCW { to { transform: rotate(-360deg); } }
  .hex-cw { transform-origin: 195px 280px; animation: rotateCW 24s linear infinite; }
  .hex-ccw { transform-origin: 195px 280px; animation: rotateCCW 18s linear infinite; }
  @keyframes hudWingIn { from{opacity:0;transform:scaleX(.4);transform-origin:center;} to{opacity:1;transform:scaleX(1);} }
  .hud-wing { animation: hudWingIn 0.5s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes statusIn { from{opacity:0;letter-spacing:.5em;} to{opacity:1;letter-spacing:.35em;} }
  .status-in { animation: statusIn 0.7s ease-out forwards; }
  @keyframes circuitDraw { from{stroke-dashoffset:200;} to{stroke-dashoffset:0;} }
  .circuit-draw { animation: circuitDraw 0.35s ease-out forwards; }
  @keyframes onlineIn { from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }
  .online-in { animation: onlineIn 0.4s ease-out forwards; }
  @keyframes verifiedFlash { 0%{opacity:0;} 30%{opacity:1;} 100%{opacity:.7;} }
  .verified-flash { animation: verifiedFlash 0.4s ease-out forwards; }
  @keyframes completePulse {
    0%,100% { text-shadow: 0 0 8px rgba(0,212,255,0.4); }
    50% { text-shadow: 0 0 20px rgba(0,212,255,0.9), 0 0 40px rgba(0,212,255,0.3); }
  }
  .complete-text {
    color:#00d4ff; font-size:15px; font-weight:700; letter-spacing:.35em;
    font-family:'Rajdhani',sans-serif;
    animation: completePulse 2.6s ease-in-out infinite;
  }
</style>
</head>
<body>
<div id="app">
  <div id="scanline"></div>
  <canvas id="particles"></canvas>
  <div id="flash"></div>

  <div id="final-input" class="hidden">
    <div class="fi-label">FINAL INPUT</div>
    <div class="fi-line-wrap">
      <div class="hud-line-pulse fi-line-bg"></div>
      <div id="fi-progress" class="fi-progress"></div>
      <div id="fi-traveler" class="line-traveler"></div>
    </div>
    <div class="fi-hint"><span>SWIPE</span><span class="swipe-arrow">→</span></div>
  </div>

  <div id="device-area">
    <div class="dev-layer" id="dev-idle"></div>
    <div class="dev-layer" id="dev-charge"></div>
    <div class="dev-layer" id="dev-transform"></div>
    <div id="dim-overlay"></div>
    <div id="tap-zone"></div>
    <div id="hud-overlay"></div>
    <div class="auth-icon-wrap hidden" id="auth-icon-wrap"><img id="auth-icon-img" alt="AUTH"></div>

    <div class="device-caption hidden" id="cap-complete" style="top:386px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <div class="complete-text status-in">TRANSFORMED</div>
        <div class="status-in" style="color:rgba(123,47,255,0.7);font-size:9px;letter-spacing:.4em;filter:drop-shadow(0 0 6px rgba(123,47,255,0.6));animation-delay:.15s;">SYSTEM COMPLETE</div>
      </div>
    </div>

    <div class="device-caption hidden" id="cap-auth-idle" style="top:388px;">
      <span style="color:rgba(0,200,220,0.3);font-size:9px;letter-spacing:.38em;">── TAP TO AUTHENTICATE ──</span>
    </div>
    <div class="device-caption hidden verified-flash" id="cap-auth-verified" style="top:388px;">
      <span style="color:rgba(0,255,136,0.8);font-size:10px;letter-spacing:.35em;filter:drop-shadow(0 0 8px rgba(0,255,136,0.5));">✓ VERIFIED</span>
    </div>
    <div class="device-caption hidden online-in" id="cap-boot-online" style="top:388px;">
      <span style="color:rgba(0,212,255,0.55);font-size:9px;letter-spacing:.45em;">SYSTEM ONLINE</span>
    </div>
  </div>

  <div id="header-hud">
    <span>NEXUS-VII</span>
    <span id="header-right">STANDBY</span>
  </div>

  <div id="control-area"></div>

  <div id="home-indicator"><div class="home-bar"></div></div>
</div>

/* ═════════════════════════════════════════════════════════
   CONSTANTS / HELPERS
═════════════════════════════════════════════════════════ */
const DX = 195, DY = 280;

function H(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (30 + 60 * i) * Math.PI / 180;
    pts.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

function sharedDefs(id) {
  return `<defs>
    <linearGradient id="mg-${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28303e"/><stop offset="45%" stop-color="#19202c"/><stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="mg2-${id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#202838"/><stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <filter id="fg-${id}" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fgs-${id}" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;
}

function deviceShell(id, lit) {
  const s = `rgba(0,200,230,${lit ? 0.22 : 0})`;
  return `
    <polygon points="${DX-154},${DY-78} ${DX+154},${DY-78} ${DX+174},${DY-56} ${DX+174},${DY+56} ${DX+154},${DY+78} ${DX-154},${DY+78} ${DX-174},${DY+56} ${DX-174},${DY-56}"
      fill="url(#mg-${id})" stroke="${lit ? s : '#16202e'}" stroke-width="1.5"/>
    <line x1="${DX-154}" y1="${DY-78}" x2="${DX+154}" y2="${DY-78}" stroke="rgba(255,255,255,0.055)" stroke-width="1"/>
    <line x1="${DX-154}" y1="${DY+78}" x2="${DX+154}" y2="${DY+78}" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
    <line x1="${DX-174}" y1="${DY-36}" x2="${DX-174}" y2="${DY+36}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="${DX+174}" y1="${DY-36}" x2="${DX+174}" y2="${DY+36}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  `;
}

function sidePanel(id, side, lit, full) {
  const panelX = side < 0 ? DX - 168 : DX + 86;
  const innerX = side < 0 ? DX - 158 : DX + 96;
  const hexCX  = side < 0 ? DX - 128 : DX + 128;
  const x0     = side < 0 ? DX - 172 : DX + 82;
  const dotXs = side < 0
    ? [[DX-170,DY-56],[DX-170,DY+56],[DX-84,DY-56],[DX-84,DY+56]]
    : [[DX+84,DY-56],[DX+84,DY+56],[DX+170,DY-56],[DX+170,DY+56]];

  let scanLines = '';
  for (let i = 0; i < 7; i++) {
    const on = lit && i % 2 === 0;
    scanLines += `<line x1="${innerX+4}" y1="${DY-44+i*14}" x2="${innerX+58}" y2="${DY-44+i*14}"
      stroke="${on ? `rgba(0,180,210,${full?0.28:0.16})` : '#101820'}" stroke-width="1"/>`;
  }
  let dots = '';
  dotXs.forEach(([x,y]) => {
    dots += `<circle cx="${x}" cy="${y}" r="2.5"
      fill="${lit ? `rgba(0,170,200,${full?0.5:0.3})` : '#182030'}"
      stroke="${lit ? `rgba(0,200,230,${full?0.4:0.2})` : '#1a2838'}" stroke-width="1"/>`;
  });
  let vents = '';
  for (let i = -2; i <= 2; i++) {
    vents += `<line x1="${x0}" y1="${DY+i*6-2}" x2="${x0+side*4}" y2="${DY+i*6-2}"
      stroke="${lit ? 'rgba(0,180,210,0.2)' : '#121c28'}" stroke-width="1"/>`;
  }

  return `<g>
    <rect x="${panelX}" y="${DY-64}" width="82" height="128" rx="4"
      fill="url(#mg2-${id})" stroke="${lit ? `rgba(0,180,210,${full?0.35:0.2})` : '#14202c'}" stroke-width="1"/>
    <rect x="${innerX}" y="${DY-54}" width="62" height="108" rx="2" fill="#09101a" stroke="#141e2c" stroke-width="1"/>
    ${scanLines}
    <polygon points="${H(hexCX,DY,22)}" fill="${lit ? `rgba(0,170,210,${full?0.18:0.09})` : '#0a1018'}"
      stroke="${lit ? `rgba(0,210,240,${full?0.75:0.42})` : '#18263a'}" stroke-width="1.5" ${lit?`filter="url(#fg-${id})"`:''}/>
    <polygon points="${H(hexCX,DY,13)}" fill="${lit ? `rgba(0,230,255,${full?0.7:0.35})` : '#090f1a'}"
      stroke="${lit ? `rgba(0,240,255,${full?0.95:0.65})` : '#162030'}" stroke-width="1"/>
    ${dots}
    ${vents}
  </g>`;
}

function coreSection(id, lit, full, text) {
  const coreAlpha = full ? 0.95 : 0.65;
  let faceLines = '';
  if (lit) {
    for (let i = 0; i < 6; i++) {
      const a = (30 + 60*i) * Math.PI/180;
      faceLines += `<line x1="${DX}" y1="${DY}" x2="${DX+42*Math.cos(a)}" y2="${DY+42*Math.sin(a)}"
        stroke="rgba(180,240,255,${full?0.22:0.1})" stroke-width="1"/>`;
    }
  }
  const glowHalo = lit ? `<polygon points="${H(DX,DY,68)}" fill="rgba(0,170,255,${full?0.18:0.07})" stroke="none" filter="url(#fgs-${id})"/>` : '';
  const dotR = lit ? (full ? 12 : 8) : 4;
  const textEl = text ? `<text x="${DX}" y="${DY+46}" text-anchor="middle"
      fill="${full?'rgba(0,230,255,0.6)':'rgba(0,200,220,0.4)'}" font-size="7" letter-spacing="3.5"
      font-family="'JetBrains Mono',monospace">${text}</text>` : '';

  return `<g>
    <polygon points="${H(DX,DY,76)}" fill="#0c1120" stroke="${lit?`rgba(0,190,230,${full?0.32:0.16})`:'#141e2e'}" stroke-width="1.5"/>
    <polygon points="${H(DX,DY,68)}" fill="${lit?'rgba(0,28,44,0.96)':'#090f1a'}"
      stroke="${lit?`rgba(0,215,255,${full?0.92:0.55})`:'#162030'}" stroke-width="${lit?2:1.5}" ${lit?`filter="url(#fg-${id})"`:''}/>
    ${glowHalo}
    <polygon points="${H(DX,DY,48)}" fill="${lit ? (full?'rgba(0,220,255,0.5)':'rgba(0,160,220,0.3)') : '#0d1828'}"
      stroke="${lit?`rgba(0,235,255,${coreAlpha})`:'#18283e'}" stroke-width="1.5" ${lit?`filter="url(#fg-${id})"`:''}/>
    ${faceLines}
    <polygon points="${H(DX,DY,24)}" fill="${lit?`rgba(0,245,255,${full?0.88:0.5})`:'#0c1828'}"
      stroke="${lit?`rgba(220,252,255,${full?0.9:0.6})`:'#18283e'}" stroke-width="1" ${lit?`filter="url(#fgs-${id})"`:''}/>

/* ═════════════════════════════════════════════════════════
   HUD OVERLAY (phase-specific SVG drawn above device)
═════════════════════════════════════════════════════════ */
function hudOverlaySVG(phase, authSt, bootLine, charge, txStep) {
  const cx = DX, cy = DY;
  const METER_R = 100;
  const CIRC = 2 * Math.PI * METER_R;
  const lit = phase !== 'POWER_OFF';

  const circuitLines = [
    [cx-66,cy-124, cx-46,cy-50],
    [cx+66,cy-124, cx+46,cy-50],
    [cx+112,cy,    cx+76,cy   ],
    [cx+66,cy+124, cx+46,cy+50],
    [cx-66,cy+124, cx-46,cy+50],
    [cx-112,cy,    cx-76,cy   ],
  ];
  function lineAlpha(n) {
    if (phase === 'POWER_OFF') return 0;
    if (phase === 'BOOT') return bootLine >= n ? (bootLine === n ? 1 : 0.4) : 0;
    return phase === 'COMPLETE' ? 0.85 : 0.42;
  }

  let circuits = '', nodes = '';
  circuitLines.forEach(([x1,y1,x2,y2], i) => {
    const a = lineAlpha(i+1);
    if (a <= 0) return;
    const len = Math.hypot(x2-x1, y2-y1);
    const isDrawing = phase==='BOOT' && bootLine===i+1;
    circuits += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#00d4ff" stroke-width="1"
      opacity="${a}" ${isDrawing?`filter="url(#hg)"`:''}
      stroke-dasharray="${len} ${len}" stroke-dashoffset="0"
      class="${isDrawing?'circuit-draw':''}"
      style="${phase!=='BOOT' ? 'transition:opacity .3s;' : ''}"/>`;
    if (lit) nodes += `<circle cx="${x1}" cy="${y1}" r="2.5" fill="#00d4ff" opacity="${a}" style="transition:opacity .3s;"/>`;
  });

  let auth = '';
  if (phase === 'AUTH') {
    auth += `<circle cx="${cx}" cy="${cy}" r="88" fill="none" stroke="rgba(0,212,255,0.14)" stroke-width="1" stroke-dasharray="5 6"/>`;
    if (authSt === 'scanning') {
      auth += `<circle cx="${cx}" cy="${cy}" r="88" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.75" filter="url(#hg)" stroke-dasharray="42 210" class="auth-spin"/>`;
      [0,90,180,270].forEach(deg => {
        const a = deg*Math.PI/180, r1=98, r2=110;
        auth += `<line x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+r2*Math.cos(a)}" y2="${cy+r2*Math.sin(a)}" stroke="rgba(0,212,255,0.6)" stroke-width="2" filter="url(#hg)"/>`;
      });
    }
    if (authSt === 'verified') {
      auth += `<circle cx="${cx}" cy="${cy}" r="88" fill="none" stroke="#00ff88" stroke-width="1.5" filter="url(#hg)" class="auth-expand"/>`;
    }
  }

  let chargeHud = '';
  if (phase === 'CHARGE') {
    const dashOffset = CIRC * (1 - charge/100);
    let ticks = '';
    [0,90,180,270].forEach(deg => {
      const a = deg*Math.PI/180;
      ticks += `<line x1="${cx+(METER_R+14)*Math.cos(a)}" y1="${cy+(METER_R+14)*Math.sin(a)}" x2="${cx+(METER_R+22)*Math.cos(a)}" y2="${cy+(METER_R+22)*Math.sin(a)}" stroke="#1a3a3a" stroke-width="2"/>`;
    });
    chargeHud = `
      <circle cx="${cx}" cy="${cy}" r="${METER_R}" fill="none" stroke="rgba(0,35,42,0.9)" stroke-width="10"/>
      <circle cx="${cx}" cy="${cy}" r="${METER_R}" fill="none" stroke="${charge>=100?'#00ff88':'#00ccee'}" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${dashOffset}"
        transform="rotate(-90 ${cx} ${cy})" filter="url(#hg)" style="transition:stroke-dashoffset .09s linear, stroke .35s;"/>
      ${ticks}
      <text x="${cx}" y="${cy+5}" text-anchor="middle" fill="${charge>=100?'#00ff88':'#00d4ff'}" font-size="13" font-weight="700"
        font-family="'JetBrains Mono',monospace" ${charge>20?`filter="url(#hg)"`:''}>${charge}%</text>
      ${charge>=100 ? `<text x="${cx}" y="${cy+METER_R+36}" text-anchor="middle" fill="rgba(0,255,136,0.75)" font-size="10" letter-spacing="4" font-family="'JetBrains Mono',monospace" filter="url(#hg)">READY</text>` : ''}
    `;
  }

  let txRings = '';
  if (phase === 'TRANSFORM') {
    [76,100,126,155,186].forEach((r, i) => {
      if (txStep > i) {
        txRings += `<polygon points="${H(cx,cy,r)}" fill="none" stroke="${i%2===0?'#00d4ff':'#7b2fff'}" stroke-width="${3-i*0.4}" opacity="${0.7-i*0.1}" filter="url(#hg)" class="tx-ring"/>`;
      }
    });
  }

  let complete = '';
  if (phase === 'COMPLETE') {
    let wingLines = '';
    [-1,1].forEach(s => {
      wingLines += `<g class="hud-wing">
        <line x1="${DX+s*68}" y1="${cy}" x2="${DX+s*172}" y2="${cy}" stroke="#00d4ff" stroke-width="2" opacity="0.65" filter="url(#hg)"/>
        <line x1="${DX+s*78}" y1="${cy-18}" x2="${DX+s*162}" y2="${cy-18}" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
        <line x1="${DX+s*78}" y1="${cy+18}" x2="${DX+s*162}" y2="${cy+18}" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
        <line x1="${DX+s*158}" y1="${cy-22}" x2="${DX+s*172}" y2="${cy-22}" stroke="#7b2fff" stroke-width="1" opacity="0.5"/>
        <line x1="${DX+s*158}" y1="${cy+22}" x2="${DX+s*172}" y2="${cy+22}" stroke="#7b2fff" stroke-width="1" opacity="0.5"/>
      </g>`;
    });
    complete = `
      <polygon points="${H(cx,cy,88)}" fill="none" stroke="rgba(0,212,255,0.45)" stroke-width="1.5" filter="url(#hg)" class="hex-cw core-pulse"/>
      <polygon points="${H(cx,cy,116)}" fill="none" stroke="rgba(123,47,255,0.3)" stroke-width="1" stroke-dasharray="5 5" class="hex-ccw"/>
      ${wingLines}
      <g class="hud-wing">
        <line x1="${cx-24}" y1="${cy-90}" x2="${cx+24}" y2="${cy-90}" stroke="rgba(0,212,255,0.45)" stroke-width="1.5" filter="url(#hg)"/>
        <line x1="${cx-24}" y1="${cy+90}" x2="${cx+24}" y2="${cy+90}" stroke="rgba(0,212,255,0.45)" stroke-width="1.5" filter="url(#hg)"/>
      </g>
      <circle cx="${cx}" cy="${cy}" r="24" fill="none" stroke="rgba(0,212,255,0.25)" stroke-width="1" class="core-pulse"/>
    `;
  }

  return `<svg width="390" height="560" viewBox="0 0 390 560">
    <defs>
      <filter id="hg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="hgs" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${circuits}${nodes}${auth}${chargeHud}${txRings}${complete}
  </svg>`;
}

const sounds = {
  boot: document.getElementById('snd-boot'),
  auth: document.getElementById('snd-auth'),
  chargeStart: document.getElementById('snd-charge-start'),
  chargeComplete: document.getElementById('snd-charge-complete'),
  swipe: document.getElementById('snd-swipe'),
};
function playSound(key) {
  const a = sounds[key];
  if (!a) return;
  try { a.currentTime = 0; a.play().catch(()=>{}); } catch(e) {}
}
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buffer = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(audioCtx.destination);
    src.start(0);
  } catch(e) {}
  Object.values(sounds).forEach(a => {
    a.play().then(()=>{ a.pause(); a.currentTime = 0; }).catch(()=>{});
  });
}

/* Simple charge hum via WebAudio (rises in pitch/volume while holding) */
let humOsc = null, humGain = null;
function startHum() {
  if (!audioCtx) return;
  stopHum();
  humOsc = audioCtx.createOscillator();
  humGain = audioCtx.createGain();
  humOsc.type = 'sawtooth';
  humOsc.frequency.value = 90;
  humGain.gain.value = 0.0001;
  humOsc.connect(humGain).connect(audioCtx.destination);
  humOsc.start();
}
function updateHum(progress01) {
  if (!humOsc || !humGain || !audioCtx) return;
  const t = audioCtx.currentTime;
  humOsc.frequency.setTargetAtTime(90 + progress01 * 260, t, 0.05);
  humGain.gain.setTargetAtTime(Math.min(0.05, 0.008 + progress01 * 0.045), t, 0.05);
}
function stopHum() {
  if (humOsc) { try { humOsc.stop(); } catch(e) {} humOsc.disconnect(); humOsc = null; }
  if (humGain) { humGain.disconnect(); humGain = null; }
}

function devImgKey() {
  if (state.phase === 'POWER_OFF') return 'idle';
  if ((state.phase === 'TRANSFORM' && state.txStep >= 4) || state.phase === 'COMPLETE') return 'transform';
  return 'charge';
}

function dimAlpha() {
  if (state.phase === 'POWER_OFF') return 0.72;
  if (state.phase === 'BOOT') return Math.max(0, 0.52 - state.bootLine * 0.085);
  if (state.phase === 'TRANSFORM' && state.txStep <= 0) return 0.75;
  return 0;
}

function renderDeviceLayers() {
  const key = devImgKey();
  el.devIdle.style.opacity = key === 'idle' ? '1' : '0';
  el.devCharge.style.opacity = key === 'charge' ? '1' : '0';
  el.devTransform.style.opacity = key === 'transform' ? '1' : '0';
  el.dim.style.background = `rgba(2,4,8,${dimAlpha()})`;
}

function renderHUD() {
  el.hud.innerHTML = hudOverlaySVG(state.phase, state.authSt, state.bootLine, state.charge, state.txStep);
}

function renderCaptions() {
  el.capComplete.classList.toggle('hidden', state.phase !== 'COMPLETE');
  el.capAuthIdle.classList.toggle('hidden', !(state.phase === 'AUTH' && state.authSt === 'idle'));
  el.capAuthVerified.classList.toggle('hidden', !(state.phase === 'AUTH' && state.authSt === 'verified'));
  el.capBootOnline.classList.toggle('hidden', !(state.phase === 'BOOT' && state.bootDone));
}

function renderAuthIcon() {
  const show = state.phase === 'AUTH';
  el.authIconWrap.classList.toggle('hidden', !show);
  el.authIconWrap.classList.remove('state-idle', 'state-scanning', 'state-verified');
  if (show) el.authIconWrap.classList.add('state-' + state.authSt);
}

function renderHeader() {
  const map = {
    POWER_OFF: 'STANDBY',
    BOOT: `MOD ${Math.min(state.bootLine,6)}/6`,
    AUTH: 'AUTH',
    CHARGE: `${state.charge}%`,
    TRANSFORM: 'TX-SEQ',
    COMPLETE: 'ACTIVE',
    FINAL_INPUT: '',
  };

}

function renderVisibility() {
  const isFinal = state.phase === 'FINAL_INPUT';

  el.deviceArea.classList.toggle('hidden', isFinal);
  el.headerHud.classList.toggle('hidden', isFinal);

function renderTapZone() {
  el.tapZone.classList.toggle('clickable', state.phase === 'AUTH');

function renderControlArea() {
  const c = el.control;
  c.innerHTML = '';

      </div>`;
    document.getElementById('power-btn').addEventListener('click', handlePower);
  } else if (state.phase === 'BOOT') {
    c.innerHTML = `<div class="caption-text">${state.bootDone ? 'ALL MODULES LOADED' : `LOADING MODULE ${Math.min(state.bootLine,6)} / 6`}</div>`;
  } else if (state.phase === 'AUTH') {
    const label = state.authSt === 'scanning' ? 'AUTHENTICATION' : state.authSt === 'verified' ? 'VERIFIED' : 'TAP CENTER TO AUTHENTICATE';
    const color = state.authSt === 'verified' ? 'rgba(0,255,136,0.55)' : state.authSt === 'scanning' ? 'rgba(0,212,255,0.4)' : 'rgba(0,200,220,0.22)';
    c.innerHTML = `<div class="caption-text" style="color:${color};letter-spacing:.5em;">${label}</div>`;

    const label = state.charge >= 100 ? 'ENERGY FULL — HOLD COMPLETE' : 'HOLD DEVICE TO CHARGE';
    const color = state.charge >= 100 ? 'rgba(0,255,136,0.55)' : 'rgba(0,200,220,0.25)';

      <div class="caption-text" style="color:${color};">${label}</div>

    c.innerHTML = `<div class="tx-blink-text${state.txStep>=4?' tx-done':''}">██ TRANSFORM SEQUENCE ██</div>`;

        <div class="complete-stats"><span>PWR&nbsp;████████&nbsp;100%</span><span>SYS&nbsp;NOMINAL</span></div>

  }
}

/* ═════════════════════════════════════════════════════════
   PHASE TRANSITIONS
═════════════════════════════════════════════════════════ */
function setPhase(next) {
  generation++;
  const gen = generation;
  state.phase = next;
  if (next !== 'BOOT') { state.bootLine = 0; state.bootDone = false; }
  if (next !== 'TRANSFORM') { state.txStep = 0; }
  if (next !== 'CHARGE') { state.charge = 0; chargeVal = 0; }
  render();

  if (next === 'BOOT') runBootSequence(gen);
  if (next === 'TRANSFORM') runTransformSequence(gen);
  if (next === 'TRANSFORM') runParticles(gen);
}

function runBootSequence(gen) {
  [250,480,710,940,1170,1400].forEach((t,i) => {
    after(t, () => { state.bootLine = i+1; render(); }, gen);
  });
  after(1800, () => { state.bootDone = true; render(); }, gen);
  after(2800, () => { setPhase('AUTH'); }, gen);
}

function runTransformSequence(gen) {
  after(50, () => { state.txStep = 1; render(); }, gen);
  [340,680,1020,1360,1700].forEach((t,i) => {
    after(t, () => { state.txStep = i+2; render(); }, gen);
  });
  after(2100, () => { el.flash.classList.add('active'); }, gen);
  after(2650, () => { el.flash.classList.remove('active'); setPhase('COMPLETE'); }, gen);
}

/* ── Particle burst (canvas) ── */
let particleRaf = null;
function runParticles(gen) {
  const canvas = el.particles;
  canvas.width = 390; canvas.height = 844;
  const ctx = canvas.getContext('2d');
  const particles = [];
  const PX = DX, PY = 280;
  for (let i = 0; i < 60; i++) {
    const a = Math.random()*Math.PI*2;
    const sp = 1.2 + Math.random()*4.5;
    const cyan = Math.random() > 0.28;
    particles.push({
      x: PX, y: PY, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1, decay: 0.005 + Math.random()*0.01,
      size: 0.6 + Math.random()*2.8,
      c: cyan ? '0,212,255' : '123,47,255',
    });
  }
  function draw() {
    if (gen !== generation) { ctx.clearRect(0,0,390,844); return; }
    ctx.clearRect(0,0,390,844);
    let alive = false;
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.02;
      p.life -= p.decay;
      if (p.life <= 0) continue;
      alive = true;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.c},${p.life*0.85})`;
      ctx.shadowBlur = 8; ctx.shadowColor = `rgba(${p.c},0.5)`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    if (alive) particleRaf = requestAnimationFrame(draw);
  }
  particleRaf = requestAnimationFrame(draw);
}

/* ═════════════════════════════════════════════════════════
   INTERACTIONS
═════════════════════════════════════════════════════════ */
function handlePower() {
  if (state.phase !== 'POWER_OFF') return;
  unlockAudio();
  const btn = document.getElementById('power-btn');
  const wrap = btn ? btn.closest('.power-wrap') : null;
  if (wrap) {
    const ripple = document.createElement('div');
    ripple.className = 'power-ripple';
    wrap.appendChild(ripple);
    setTimeout(() => ripple.remove(), 450);
  }
  playSound('boot');
  setTimeout(() => setPhase('BOOT'), 380);
}

function handleAuth() {
  if (state.phase !== 'AUTH' || state.authSt !== 'idle') return;
  const gen = generation;
  state.authSt = 'scanning';
  playSound('auth');
  render();
  after(1350, () => { state.authSt = 'verified'; render(); }, gen);
  after(2700, () => { state.authSt = 'idle'; setPhase('CHARGE'); }, gen);
}

/* ── Long press (CHARGE) ── */
let chargeVal = 0;
let holding = false;
let chargeInterval = null;

function startHold(e) {
  if (state.phase !== 'CHARGE') return;
  e.preventDefault();
  if (holding) return;
  holding = true;
  playSound('chargeStart');
  startHum();
  chargeInterval = setInterval(() => {
    if (!holding) return;
    chargeVal = Math.min(100, chargeVal + 100/28);
    state.charge = Math.min(100, Math.round(chargeVal));
    updateHum(state.charge/100);
    renderHUD(); renderHeader(); renderControlArea();
    if (chargeVal >= 100) {
      clearInterval(chargeInterval);
      holding = false;
      stopHum();
      playSound('chargeComplete');
      const gen = generation;
      setTimeout(() => { if (gen === generation) setPhase('FINAL_INPUT'); }, 1100);
    }
  }, 100);
}
function endHold() {
  holding = false;
  stopHum();
  if (chargeInterval) clearInterval(chargeInterval);
}

/* ── Swipe (FINAL_INPUT) ── */
let swipeStartX = null;
function onTouchStart(e) {
  if (state.phase === 'FINAL_INPUT') swipeStartX = e.touches[0].clientX;
}
function onTouchMove(e) {
  if (state.phase !== 'FINAL_INPUT' || swipeStartX === null) return;
  const p = Math.max(0, Math.min(1, (e.touches[0].clientX - swipeStartX) / 220));
  state.swipeP = p;
  el.fiProgress.classList.add('dragging');
  el.fiProgress.style.width = Math.max(2, p*100) + '%';
  el.fiTraveler.style.display = p > 0 ? 'none' : 'block';
}
function onTouchEnd(e) {
  if (state.phase !== 'FINAL_INPUT' || swipeStartX === null) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  swipeStartX = null;
  el.fiProgress.classList.remove('dragging');
  el.fiProgress.style.width = '2%';
  el.fiTraveler.style.display = 'block';
  state.swipeP = 0;
  if (dx > 90) {
    playSound('swipe');
    setPhase('TRANSFORM');
  }
}

const appEl = document.getElementById('app');
appEl.addEventListener('touchstart', onTouchStart, {passive:true});
appEl.addEventListener('touchmove', onTouchMove, {passive:true});
appEl.addEventListener('touchend', onTouchEnd, {passive:true});

el.tapZone.addEventListener('click', () => { if (state.phase==='AUTH') handleAuth(); });
el.tapZone.addEventListener('touchstart', (e) => { if (state.phase==='CHARGE') startHold(e); });
el.tapZone.addEventListener('touchend', () => { if (state.phase==='CHARGE') endHold(); });
el.tapZone.addEventListener('mousedown', (e) => { if (state.phase==='CHARGE') startHold(e); });
el.tapZone.addEventListener('mouseup', () => { if (state.phase==='CHARGE') endHold(); });
el.tapZone.addEventListener('mouseleave', () => { if (state.phase==='CHARGE') endHold(); });

/* ═════════════════════════════════════════════════════════
   INIT
═════════════════════════════════════════════════════════ */
render();
})();
</script>
