<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060b">
<title>DIGITAL TRANSFORM // MOBILE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030409;color:#eaf8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
body{display:flex;justify-content:center;align-items:center}
#app{position:relative;width:min(100vw,430px);height:100dvh;max-height:932px;overflow:hidden;background:
radial-gradient(circle at 50% 43%,rgba(0,230,255,.11),transparent 30%),
linear-gradient(180deg,#070914,#020308 72%);isolation:isolate}
#app:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);mix-blend-mode:screen;pointer-events:none;z-index:10}
.grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(0,200,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.08) 1px,transparent 1px);background-size:28px 28px;transform:perspective(450px) rotateX(62deg) translateY(30%);transform-origin:center bottom;opacity:.45;z-index:-1}
.header{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.12em;font-size:10px;color:#71dff5}
.status{display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#35f2ff;box-shadow:0 0 10px #35f2ff}
.core{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);width:190px;height:190px;border:1px solid rgba(50,239,255,.35);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 50px rgba(0,220,255,.12),inset 0 0 30px rgba(0,220,255,.06);transition:.4s}
.core:before,.core:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(50,239,255,.18)}
.core:before{inset:18px}.core:after{inset:42px}
.core.active{transform:translate(-50%,-50%) scale(1.16);border-color:#61f6ff;box-shadow:0 0 80px rgba(0,229,255,.5),inset 0 0 55px rgba(0,229,255,.18)}
.core .glyph{font-size:52px;font-weight:800;letter-spacing:-.08em;color:#dfffff;text-shadow:0 0 20px #00eaff;transform:skew(-8deg)}
.core .scan{position:absolute;width:100%;height:2px;background:linear-gradient(90deg,transparent,#8fffff,transparent);animation:scan 2.4s linear infinite}
@keyframes scan{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#message{position:absolute;top:calc(43% + 118px);left:20px;right:20px;text-align:center;font-size:11px;letter-spacing:.18em;color:#83dcea;min-height:20px}
#phase{position:absolute;top:calc(43% + 143px);left:20px;right:20px;text-align:center;font-size:9px;letter-spacing:.28em;color:#506d76}
.controls{position:absolute;z-index:40;left:18px;right:18px;bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));display:grid;gap:12px}
.power{height:58px;border:1px solid rgba(74,238,255,.5);background:rgba(3,19,25,.78);border-radius:16px;color:#bffaff;font-size:13px;font-weight:700;letter-spacing:.22em;box-shadow:0 0 20px rgba(0,218,255,.08);backdrop-filter:blur(10px)}
.power:active{transform:scale(.98);background:rgba(12,58,68,.9)}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:48px;border:1px solid rgba(100,170,185,.3);border-radius:13px;background:rgba(8,13,21,.82);color:#78959e;font-size:10px;letter-spacing:.16em}
.btn.ready{color:#b9fbff;border-color:rgba(80,240,255,.6);box-shadow:0 0 18px rgba(0,220,255,.08)}
.btn:active{transform:scale(.97)}
#swipeZone{position:absolute;inset:0;display:none;z-index:20}
#swipeZone.show{display:block}
.swipeHint{position:absolute;left:50%;bottom:138px;transform:translateX(-50%);width:74%;height:72px;border:1px solid rgba(92,235,255,.22);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:16px;background:rgba(3,12,17,.5);backdrop-filter:blur(8px);color:#b7faff;letter-spacing:.2em;font-size:10px}
.arrow{font-size:24px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%,100%{transform:translateX(-7px);opacity:.4}50%{transform:translateX(7px);opacity:1}}
.flash{position:absolute;inset:0;background:#eaffff;opacity:0;pointer-events:none;z-index:30}
.flash.go{animation:flash .65s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:.95}100%{opacity:0}}
.ring{position:absolute;left:50%;top:43%;width:80px;height:80px;border:2px solid #dfffff;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none}
.ring.go{animation:ring 1.1s cubic-bezier(.15,.7,.15,1) forwards}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
#result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,rgba(0,232,255,.2),rgba(2,4,10,.94) 60%);z-index:25}
#result.show{display:flex;animation:resultIn .5s ease-out}
@keyframes resultIn{from{opacity:0}to{opacity:1}}
.resultTitle{font-size:13px;letter-spacing:.45em;color:#74f6ff;margin-left:.45em}
.resultMain{font-size:42px;font-weight:900;letter-spacing:.08em;text-shadow:0 0 25px #00eaff;margin:14px 0}
.resultSub{font-size:9px;letter-spacing:.3em;color:#6b8f98}
.reboot{margin-top:34px;padding:14px 25px;border:1px solid #4beaff;border-radius:999px;background:rgba(0,230,255,.08);color:#bfffff;letter-spacing:.18em;font-size:10px}

/* --- V2 transformation HUD --- */
.hud{position:absolute;left:18px;right:18px;top:72px;display:flex;justify-content:space-between;pointer-events:none;z-index:12;font:8px/1.4 ui-monospace,SFMono-Regular,monospace;letter-spacing:.18em;color:#4ca8b7}
.hud b{color:#b9fbff;font-weight:600}
.meter{position:absolute;left:50%;top:calc(43% - 126px);transform:translateX(-50%);width:150px;height:3px;background:rgba(120,220,240,.12);overflow:hidden;border-radius:4px;opacity:.8}
.meter i{display:block;width:0;height:100%;background:#7ef8ff;box-shadow:0 0 12px #00eaff;transition:width .08s linear}
.hex{position:absolute;left:50%;top:43%;width:250px;height:250px;transform:translate(-50%,-50%) rotate(30deg);border:1px dashed rgba(100,240,255,.13);clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%);pointer-events:none;opacity:.55}
.particles{position:absolute;inset:0;pointer-events:none;z-index:22}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#bfffff;box-shadow:0 0 10px #00eaff;opacity:0}
.particle.fly{animation:fly 900ms ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}
.transformLabel{position:absolute;left:50%;top:calc(43% - 105px);transform:translateX(-50%);font:700 8px monospace;letter-spacing:.38em;color:#5feeff;opacity:0;white-space:nowrap}
.transformLabel.on{animation:labelPulse 1.2s ease-out forwards}
.core.readyPulse{animation:corePulse 1.8s ease-in-out infinite}
@keyframes corePulse{0%,100%{box-shadow:0 0 35px rgba(0,229,255,.12),inset 0 0 25px rgba(0,229,255,.05)}50%{box-shadow:0 0 65px rgba(0,229,255,.28),inset 0 0 42px rgba(0,229,255,.12)}}
@keyframes labelPulse{0%{opacity:0;letter-spacing:.7em}20%,75%{opacity:1}100%{opacity:0;letter-spacing:.25em}}
</style>
</head>
<body>
<main id="app">
  <div class="grid"></div>
  <div class="hex"></div>
  <div class="hud"><span>DX-MODULE <b>01</b></span><span id="hudMode">STANDBY</span></div>
  <div class="meter"><i id="meterBar"></i></div>
  <div class="transformLabel" id="transformLabel">DIGITAL CORE // UNLOCK</div>
  <div class="particles" id="particles"></div>
  <header class="header">
    <div>DX//MOBILE SYSTEM</div>
    <div class="status"><span class="dot"></span><span id="status">OFFLINE</span></div>
  </header>

  <section class="core" id="core"><div class="scan"></div><div class="glyph">D-X</div></section>
  <div id="message">POWER BUTTON TO INITIALIZE</div>
  <div id="phase">SYSTEM STANDBY</div>

  <div class="controls" id="controls">
    <button class="power" id="power">◉　POWER ON</button>
    <div class="panel">
      <button class="btn" id="tapBtn">TOUCH INPUT</button>
      <button class="btn" id="holdBtn">HOLD / CHARGE</button>
    </div>
  </div>

  <div id="swipeZone">
    <div class="swipeHint"><span>SWIPE →</span><span class="arrow">›</span><span>TRANSFORM</span></div>
  </div>
  <div class="flash" id="flash"></div><div class="ring" id="ring"></div>

  <section id="result">
    <div class="resultTitle">SYSTEM COMPLETE</div>
    <div class="resultMain">TRANSFORMED</div>
    <div class="resultSub">DIGITAL FORM // ONLINE</div>
    <button class="reboot" id="reboot">REBOOT SYSTEM</button>
  </section>
</main>

<script>
(() => {
  let audio=null, master=null, osc=null, lfo=null, state="off", holdTimer=null, holdProgress=0;
  const $=id=>document.getElementById(id);
  const core=$("core"), message=$("message"), phase=$("phase"), status=$("status");
  const power=$("power"), tapBtn=$("tapBtn"), holdBtn=$("holdBtn"), swipeZone=$("swipeZone");
  const flash=$("flash"), ring=$("ring"), result=$("result"), reboot=$("reboot");

  function initAudio(){
    if(audio) { audio.resume(); return; }
    audio=new (window.AudioContext||window.webkitAudioContext)();
    master=audio.createGain(); master.gain.value=.16; master.connect(audio.destination);
  }
  function tone(freq,dur,type="sine",gain=.15,slideTo=null){
    if(!audio)return;
    const o=audio.createOscillator(), g=audio.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,audio.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,audio.currentTime+dur);
    g.gain.setValueAtTime(.0001,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(gain,audio.currentTime+.015);
    g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);
    o.connect(g).connect(master); o.start(); o.stop(audio.currentTime+dur+.03);
  }
  function noise(dur=.25,gain=.05){
    if(!audio)return;
    const n=audio.createBufferSource(), b=audio.createBuffer(1,audio.sampleRate*dur,audio.sampleRate);
    const data=b.getChannelData(0); for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
    const g=audio.createGain(); g.gain.setValueAtTime(gain,audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);
    n.buffer=b;n.connect(g).connect(master);n.start();
  }
  function startup(){
    tone(90,.5,"sawtooth",.12,220); setTimeout(()=>tone(330,.18,"square",.09,880),130);
    setTimeout(()=>tone(880,.32,"sine",.11,1760),280); setTimeout(()=>noise(.18,.025),400);
  }
  function standby(){
    if(!audio)return;
    [0,260,520,780].forEach((t,i)=>setTimeout(()=>tone(110*Math.pow(2,i/3),.18,"triangle",.035),t));
    osc=audio.createOscillator(); const g=audio.createGain();
    osc.type="sine";osc.frequency.value=55;g.gain.value=.012;osc.connect(g).connect(master);osc.start();
    lfo=audio.createOscillator();const lg=audio.createGain();lfo.frequency.value=.16;lg.gain.value=10;lfo.connect(lg).connect(osc.frequency);lfo.start();
  }
  function stopStandby(){try{osc?.stop();lfo?.stop()}catch(e){}osc=lfo=null}
  function tapSound(){tone(620,.08,"square",.08,980);tone(1240,.06,"sine",.035)}
  function transformSound(){
    stopStandby();
    [220,330,495,740,1110,1660].forEach((f,i)=>setTimeout(()=>tone(f,.24,"sawtooth",.07,f*1.8),i*90));
    setTimeout(()=>noise(.7,.07),300);
    setTimeout(()=>{tone(220,.8,"sine",.11,1760);tone(440,.7,"square",.07,3520)},480);
  }
  function vibrate(p){if(navigator.vibrate) navigator.vibrate(p)}



  function speak(text, rate=1.15, pitch=0.72){
    try{
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang="en-US"; u.rate=rate; u.pitch=pitch; u.volume=.72;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function powerCallout(){
    speak("System online");
  }
  function readyCallout(){
    speak("Ready");
  }
  function transformCallout(){
    speak("Transform");
  }

  function cinematicTransform(){
    stopStandby();
    // rising digital sequence
    const seq=[
      [130,.28,"sawtooth",.055,260,0],
      [260,.25,"square",.055,520,150],
      [390,.25,"square",.06,780,300],
      [585,.25,"sawtooth",.065,1170,450],
      [880,.30,"triangle",.07,1760,600],
      [1320,.42,"sawtooth",.08,2640,760],
      [1760,.55,"sine",.11,3520,980]
    ];
    seq.forEach(([f,d,t,g,to,delay])=>setTimeout(()=>tone(f,d,t,g,to),delay));
    setTimeout(()=>noise(.22,.055),720);
    setTimeout(()=>noise(.5,.085),1080);
    setTimeout(()=>{tone(440,.7,"sine",.12,1760);tone(660,.65,"square",.065,2640)},1250);
    setTimeout(()=>tone(1760,.9,"sine",.10,440),1450);
  }

  function voiceBeep(seq){
    seq.forEach(([f,d,delay])=>setTimeout(()=>tone(f,d,"square",.045,f*1.05),delay));
  }
  function chargePulse(n){
    for(let i=0;i<n;i++) setTimeout(()=>tone(260+i*34,.055,"triangle",.022,520+i*50),i*55);
  }
  function digitalCallout(type){
    if(type==="ready"){voiceBeep([[740,.06,0],[980,.08,90],[1320,.11,190]]); setTimeout(readyCallout,260);}
    if(type==="charge"){voiceBeep([[420,.06,0],[560,.06,75],[760,.09,150]]);}
    if(type==="final"){voiceBeep([[880,.06,0],[1180,.06,80],[1560,.1,170],[2080,.16,270]]); setTimeout(transformCallout,300);}
  }
  function spawnParticles(){
    const box=$("particles"); box.innerHTML="";
    for(let i=0;i<28;i++){
      const d=document.createElement("i"); d.className="particle";
      d.style.left="50%"; d.style.top="43%";
      d.style.setProperty("--x",(Math.random()*320-160)+"px");
      d.style.setProperty("--y",(Math.random()*420-210)+"px");
      d.style.animationDelay=(Math.random()*180)+"ms";
      box.appendChild(d);
      requestAnimationFrame(()=>d.classList.add("fly"));
    }
  }
  function beginTransform(){
    state="transform"; swipeZone.classList.remove("show");
    message.textContent="TRANSFORM SEQUENCE"; phase.textContent="EXECUTING // 100%";
    $("hudMode").textContent="TRANSFORM";
    transformLabel.classList.remove("on"); void transformLabel.offsetWidth; transformLabel.classList.add("on");
    core.classList.add("active");
    ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");
    flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
    spawnParticles(); digitalCallout("final"); cinematicTransform();
    vibrate([40,30,80,30,180]);
    setTimeout(()=>result.classList.add("show"),1050);
  }

  function setState(s){
    state=s;
    if(s==="ready"){
      status.textContent="ONLINE"; message.textContent="SYSTEM READY"; phase.textContent="INPUT REQUIRED"; $("hudMode").textContent="ONLINE"; core.classList.add("readyPulse"); digitalCallout("ready");
      $("tapBtn").classList.add("ready"); $("holdBtn").classList.add("ready");
    }
  }

  function powerOn(){
    if(state!=="off")return;
    initAudio(); startup(); powerCallout(); vibrate([30,20,60]); state="boot";
    status.textContent="BOOTING"; message.textContent="INITIALIZING DIGITAL CORE"; phase.textContent="PLEASE WAIT";
    power.textContent="◉　SYSTEM ONLINE";
    core.classList.add("active");
    setTimeout(()=>{standby();setState("ready")},1100);
  }

  power.addEventListener("click",powerOn);
  power.addEventListener("touchend",e=>{e.preventDefault();powerOn()},{passive:false});

  /* Mobile Safari fallback: make the two input controls respond to touch directly. */
  tapBtn.addEventListener("touchend",e=>{e.preventDefault();tapBtn.click()},{passive:false});

  tapBtn.addEventListener("click",()=>{
    if(state!=="ready")return;
    tapSound();vibrate(18);tapBtn.textContent="TOUCH ACCEPTED"; $("hudMode").textContent="AUTH";
    message.textContent="BIOMETRIC TOUCH VERIFIED";phase.textContent="STEP 01 // INPUT";
    setTimeout(()=>tapBtn.textContent="TOUCH INPUT",700);
    setTimeout(()=>{message.textContent="HOLD TO CHARGE";phase.textContent="STEP 02 // ENERGY"},850);
  });

  holdBtn.addEventListener("touchstart",e=>{e.preventDefault(); beginHold()},{passive:false});

  function beginHold(){
    const e = { preventDefault:()=>{} };

    if(state!=="ready")return;
    e.preventDefault(); initAudio(); holdProgress=0;
    message.textContent="CHARGING DIGITAL CORE";phase.textContent="STEP 02 // HOLD"; digitalCallout("charge");
    holdTimer=setInterval(()=>{
      holdProgress+=5; tone(180+holdProgress*7,.045,"square",.025); $("meterBar").style.width=holdProgress+"%";
      holdBtn.textContent="CHARGING "+holdProgress+"%";
      if(holdProgress>=100){clearInterval(holdTimer);holdTimer=null;state="swipe"; chargePulse(8);holdBtn.textContent="CHARGED";message.textContent="SWIPE TO TRANSFORM";phase.textContent="FINAL INPUT // SWIPE";swipeZone.classList.add("show");vibrate([40,40,80]);tone(880,.2,"sine",.08,1760)}
    },55);
  }
  holdBtn.addEventListener("pointerdown",e=>{e.preventDefault();beginHold()});
  ["pointerup","pointercancel","pointerleave","touchend","touchcancel"].forEach(ev=>holdBtn.addEventListener(ev,()=>{
    if(holdTimer){clearInterval(holdTimer);holdTimer=null;holdBtn.textContent="HOLD / CHARGE";message.textContent="CHARGE INTERRUPTED";phase.textContent="HOLD TO RESUME";}
  }));

  let sx=0,sy=0;
  swipeZone.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});
  swipeZone.addEventListener("pointerup",e=>{
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(state==="swipe" && dx>90 && Math.abs(dx)>Math.abs(dy)*1.3){
      beginTransform();
    }
  });
  swipeZone.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
  swipeZone.addEventListener("touchend",e=>{
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(state==="swipe" && dx>90 && Math.abs(dx)>Math.abs(dy)*1.3){
      beginTransform();
    }
  },{passive:true});

  reboot.addEventListener("click",()=>{
    stopStandby(); try{window.speechSynthesis.cancel()}catch(e){} result.classList.remove("show"); core.classList.remove("active");
    state="off";status.textContent="OFFLINE";message.textContent="POWER BUTTON TO INITIALIZE";phase.textContent="SYSTEM STANDBY";
    power.textContent="◉　POWER ON";tapBtn.textContent="TOUCH INPUT";holdBtn.textContent="HOLD / CHARGE";
    holdProgress=0; $("meterBar").style.width="0%"; $("hudMode").textContent="STANDBY";
  });
})();
</script>
</body>
</html>
